# Despliegue de 388 Pueblos en Render.
#
# 1. pueblos388: la web, estática, en el CDN de Render. Gratis, sin esperas (no se duerme) y cerca de quien la
#    visita. tools/build_web.py la empaqueta en dist/web con versiones en los JS y CSS para poder guardarlos un año.
# 2. 388-pueblos: el servidor propio (API de votos y lista de espera, multijugador del juego; sus páginas redirigen a
#    la web estática con SITE_URL). En el plan gratuito se duerme tras unos minutos sin visitas y su base de datos
#    SQLite, en /tmp, se borra al publicar, al reiniciar y al dormirse: para que la lista de espera no se pierda hace
#    falta un plan de pago con disco persistente (ver README, «Lista de espera y votos»).
services:
  - type: web
    name: pueblos388
    runtime: static
    buildCommand: python3 tools/build_web.py --api https://three88-pueblos.onrender.com/api --site https://pueblos388.onrender.com
    staticPublishPath: ./dist/web
    # (las opiniones de quien prueba el juego, en la web: /feedbacks la sirve el servidor, server/servidor.py, op_feedbacks;
    # entrando con la clave OPINIONES_CLAVE. 22-11-2026)
    routes:
      - type: rewrite
        source: /feedbacks
        destination: https://three88-pueblos.onrender.com/feedbacks
      - type: rewrite
        source: /feedbacks/*
        destination: https://three88-pueblos.onrender.com/feedbacks/*
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        # (el micrófono, solo para esta web y su juego: la opinión por voz de quien lo prueba, src/opinion.js del juego)
        value: camera=(), microphone=(self), geolocation=(), payment=()
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /guarena.html
        name: Cache-Control
        value: no-cache
      - path: /pueblo.html
        name: Cache-Control
        value: no-cache
      - path: /privacidad.html
        name: Cache-Control
        value: no-cache
      - path: /legal.html
        name: Cache-Control
        value: no-cache
      - path: /js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800

  - type: web
    name: 388-pueblos
    runtime: python
    plan: free
    # (pg8000: el cliente de Postgres, de Python puro, para guardar las opiniones del juego)
    buildCommand: python3 -m pip install "pg8000>=1.30,<2" && python3 -m py_compile server/servidor.py server/pagina.py
    startCommand: python3 server/servidor.py --host 0.0.0.0 --port $PORT --db /tmp/388pueblos.sqlite3
    healthCheckPath: /api/online
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SITE_URL
        value: https://pueblos388.onrender.com
      # (los vecinos del juego de Guareña con GPT, /api/vecinos: la clave de OpenAI se pone en el panel de Render, nunca
      # aquí; sync: false hace que Render la pida y no la guarde en este archivo)
      - key: OPENAI_API_KEY
        sync: false
      # (las opiniones de quien prueba el juego, /api/opinion: el modelo que pasa la voz a texto. El correo —RESEND_API_KEY,
      # OPINIONES_CORREO— y el canal de Discord —DISCORD_OPINIONES— siguen en el servidor por si se quieren, pero no se usan:
      # si se ponen en el panel, hay que decirlo en la página de privacidad)
      - key: OPENAI_TRANSCRIPCION
        value: whisper-1
      - key: OPENAI_MODELO
        value: gpt-5.6-luna
      - key: OPENAI_ESFUERZO
        value: high
      # (las opiniones: la dirección de su base, la de abajo, por la red interna; y la clave de su página privada,
      # /feedbacks, que genera Render y se lee en el panel —Environment—. 22-11-2026: faltaban, y el buzón decía «no está
      # montado» aunque la base estaba creada)
      - key: DATABASE_URL
        fromDatabase:
          name: opiniones388
          property: connectionString
      - key: OPINIONES_CLAVE
        generateValue: true

# Las opiniones de quien prueba el juego (/api/opinion). La gratuita da 1 GB, caduca a los 30 días de crearse (con 14 de
# gracia) y no tiene copias de seguridad: hay que descargarlas desde la página privada.
databases:
  - name: opiniones388
    plan: free
    databaseName: opiniones
    ipAllowList: []   # (solo por la red interna de Render: nadie de fuera)
